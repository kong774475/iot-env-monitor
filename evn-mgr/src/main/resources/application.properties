server.port=8081
server.servlet.context-path=/envMgr

spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/harmony_env_db?useUnicode=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=mysql

spring.datasource.type=org.apache.commons.dbcp2.BasicDataSource
spring.datasource.dbcp2.max-wait-millis=60000
spring.datasource.dbcp2.max-total=20
spring.datasource.dbcp2.max-idle=2
spring.datasource.dbcp2.default-auto-commit=false
spring.datasource.dbcp2.min-idle=1

mybatis.type-aliases-package=com.xjteam4.envMgr.domain
mybatis.mapper-locations=classpath*:mapper/*Mapper.xml

#log4j
logging.level.com.xjteam4.envMgr=INFO
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# swagger
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MQTT Broker
#0.0.0.0?? MQTT Broker
mqtt.broker.host=0.0.0.0
mqtt.broker.port=1883

# MQTT
mqtt.client.broker-url=tcp://localhost:1883
mqtt.client.client-id=springboot-sub-client
mqtt.client.topic=sensor/temp_hum
#???????????????
mqtt.client.username=
mqtt.client.password=

# ????????
mqtt.cmd.topic.prefix=cmd/device/
